[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "falcon-core"
version = "0.3.0"
description = "Shared core library for the Falcon platform"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0"
]

[tool.setuptools.packages.find]
where = ["."]